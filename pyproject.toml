[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "grammarguard"
version = "2.0.0.dev0"
description = "Formal guarantees for LLM output, and formal QA for the validators behind them."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []  # grammarguard.core is standard library only

[project.optional-dependencies]
ml = ["torch", "transformers>=4.40"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "pydantic>=2.6", "pydantic-settings>=2.2", "sse-starlette>=2.0"]
ui = ["streamlit>=1.35"]
dev = ["pytest>=8", "hypothesis>=6", "httpx>=0.27", "ruff>=0.4", "mypy>=1.10"]

[project.scripts]
grammarguard = "grammarguard.cli:main"

[tool.setuptools.packages.find]
include = ["grammarguard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: loads GPT-2 (deselect with -m 'not slow')"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N"]
ignore = ["N802", "N806"]  # theory names like S, U, F follow the textbook

[tool.mypy]
python_version = "3.11"
packages = ["grammarguard.core"]
ignore_missing_imports = true
